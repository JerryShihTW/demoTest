<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算機</title>
</head>
<body>
    <form action="">
        <h1>BMI計算機</h1>
        <label for="weight">請輸入體重(公斤):</label>
        <input type="number" id="weight" name="weight" placeholder="請輸入體重" required><br><br>
        
        <label for="height">請輸入身高(公分):</label>
        <input type="number" id="height" name="height" placeholder="請輸入身高" required><br><br>

        <input type="radio" id="male" name="sex" checked>男
        <input type="radio" id="female" name="sex">女    
        <br><br>

        <input type="submit" value="計算BMI">
        <input type="reset" value="重設"><br><br>
    </form>
</body>
</html>
